name: 🧹 Clean

steps:
  - glob: extensions/*
    save-to: exts
    regular: false

  - matrix:
      extension: ${{ exts }}
    steps:
      - run: rubisco clean
        cwd: ${{ extension }}

  - name: 🧹 Clean `__pycache__`
    remove:
      [
        "build",
        "dist",
        "*/**/__pycache__",
        ".rubisco/*.log",
        "*.7z",
        "*.gz",
        "*.xz",
        "*.zip",
        "rubisco-*",
      ]
    strict: false
