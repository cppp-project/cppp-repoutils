name: 📄 Generate POT file.

steps:
  - name: 📄 Find source files.
    glob: "rubisco/**/*.py"
    save-to: src-files
    recursive: True

  - name: 📄 Generate POT file.
    run: [
      xgettext,
      --language=python,
      "--default-domain=${{ project.name }}",
      "--package-name=${{ project.name }}",
      "--package-version=${{ project.version }}",
      --msgid-bugs-address=wushengwuxi-msctinoulk@outlook.com,
      "--copyright-holder=The C++ Plus Project",
      --directory=rubisco,
      --output=po/rubisco.pot,
      --keyword=_,
      --from-code=UTF-8,
      --width=80,
      "${{ src-files }}",
      ]
